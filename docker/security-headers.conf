# nginx replaces, rather than merges, inherited add_header directives as soon
# as a location declares one of its own. Every location that sets a header must
# therefore include this file, or it silently loses all of them.

# The LAN test setup is plain HTTP, so connect-src must allow ws: as well as
# wss:; both are restricted to this same origin.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; media-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

# Cross-Origin-Opener-Policy is deliberately absent: browsers ignore it on a
# non-secure origin and log an error for it on every load, and the documented
# LAN test setup is plain HTTP. Add it back behind HTTPS.
