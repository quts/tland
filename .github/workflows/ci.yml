name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches Dockerfile breakage without pushing anything anywhere.
      - name: Build the game image
        run: docker build -f docker/game.Dockerfile -t tland/game:ci .

      - name: Build the web image
        run: docker build -f docker/web.Dockerfile -t tland/web:ci .
