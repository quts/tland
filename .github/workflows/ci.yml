name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  e2e:
    name: WebKit smoke test
    runs-on: ubuntu-latest
    # The official image already carries WebKit and its system libraries.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches Dockerfile breakage without pushing anything anywhere.
      - name: Build the game image
        run: docker build -f docker/game.Dockerfile -t tland/game:ci .

      - name: Build the web image
        run: docker build -f docker/web.Dockerfile -t tland/web:ci .

      - name: Check the security headers nginx actually serves
        run: |
          docker run -d --name web -p 8080:80 -e GAME_UPSTREAM=127.0.0.1:3000 tland/web:ci
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/ && break
            sleep 1
          done
          headers=$(curl -sI http://127.0.0.1:8080/)
          echo "$headers"
          for header in \
            "Content-Security-Policy" \
            "X-Content-Type-Options" \
            "Referrer-Policy" \
            "X-Frame-Options"
          do
            echo "$headers" | grep -qi "^$header:" || {
              echo "missing $header"
              exit 1
            }
          done
          docker rm -f web
