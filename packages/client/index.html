<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#a9dcc0" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="A cozy little town by the river." />
    <!-- Keep iOS from treating the canvas like a web page it can zoom and scroll. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Riverside Town</title>
    <link rel="preload" href="/fonts/jf-openhuninn-2.1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="join" class="join" hidden>
        <div class="join-card" role="dialog" aria-labelledby="join-title">
          <h1 id="join-title" class="join-title">河岸小鎮</h1>
          <p class="join-subtitle">挑個名字和模樣，就可以進來散步了</p>

          <canvas id="avatar-preview" class="avatar-preview" width="144" height="184"
                  aria-label="Avatar preview"></canvas>

          <div class="builder">
            <div class="builder-row">
              <span class="builder-label">膚色</span>
              <div id="pick-body" class="swatches"></div>
            </div>
            <div class="builder-row">
              <span class="builder-label">配色</span>
              <div id="pick-shirt" class="swatches"></div>
            </div>
          </div>

          <label class="field">
            <span class="field-label">暱稱</span>
            <input
              id="nickname"
              class="field-input"
              type="text"
              maxlength="16"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="go"
              placeholder="1–16 個字"
            />
          </label>

          <p id="join-error" class="join-error" role="alert" hidden></p>

          <button id="join-button" class="button-primary" type="button" disabled>
            連線中…
          </button>
          <p id="join-count" class="join-count"></p>
        </div>
      </div>

      <div id="game" aria-label="Game world" role="application"></div>
      <div id="house-actions" class="house-actions">
      <button id="house-notice-open" type="button" class="house-notice-open"
        aria-haspopup="dialog" aria-controls="house-notice-dialog" hidden>閱讀告示牌</button>
      <button id="house-enter" type="button" class="house-notice-open house-enter"
        aria-haspopup="dialog" aria-controls="bar-interior" hidden>進入屋子</button>
      </div>
      <dialog id="bar-interior" class="bar-interior" aria-label="酒吧">
        <button id="bar-exit" type="button" aria-label="返回戶外">←</button>
        <button id="bar-scene" type="button" aria-label="點擊酒吧" aria-haspopup="dialog"
          aria-controls="bar-greeting">
          <img id="bar-picture" alt="" decoding="async" draggable="false" />
        </button>
      </dialog>
      <dialog id="bar-game" class="bar-game" aria-labelledby="game-title">
        <img id="game-backdrop" alt="" draggable="false" />
        <div class="game-layout">
          <header class="game-header">
            <div class="game-intro">
              <h2 id="game-title"></h2>
              <p id="game-question"></p>
              <p id="game-reference"></p>
            </div>
            <button id="game-exit" type="button" aria-label="返回酒吧">←</button>
          </header>
          <div id="game-workspace" class="game-workspace">
            <section class="game-panel game-bank-panel" aria-labelledby="game-bank-title">
              <h3 id="game-bank-title">積木區</h3>
              <div id="game-bank" class="game-scroll"></div>
            </section>
            <section class="game-panel game-assembly-panel" aria-labelledby="game-assembly-title">
              <div class="game-panel-heading">
                <h3 id="game-assembly-title"><span id="game-assembly-label">組合區</span> <span id="game-progress"></span></h3>
                <button id="game-reset" type="button">↻ 重置</button>
              </div>
              <div id="game-assembly" class="game-scroll"></div>
            </section>
            <section id="circuit-results" class="game-panel circuit-results" aria-labelledby="circuit-results-title" hidden>
              <h3 id="circuit-results-title">真值表（測試結果）</h3>
              <div class="game-scroll">
                <table><thead><tr><th scope="col">A</th><th scope="col">B</th><th scope="col">Sum</th><th scope="col">Carry</th></tr></thead>
                  <tbody id="circuit-truth"></tbody>
                </table>
              </div>
            </section>
            <section id="dijkstra-example" class="game-panel dijkstra-example" aria-labelledby="dijkstra-example-title" hidden>
              <h3 id="dijkstra-example-title">範例圖（起點 A）</h3>
              <svg viewBox="0 0 260 260" role="img" aria-label="起點 A；A 到 B 權重 2，A 到 C 權重 5，A 到 D 權重 4，B 到 D 權重 1，C 到 D 權重 2">
                <g class="graph-edges">
                  <path d="M130 36 44 130 M130 36 216 130 M130 36 130 218 M44 130 130 218 M216 130 130 218" />
                </g>
                <g class="graph-weights">
                  <text x="68" y="76">2</text><text x="185" y="76">5</text><text x="142" y="131">4</text>
                  <text x="67" y="194">1</text><text x="188" y="194">2</text>
                </g>
                <g class="graph-nodes">
                  <circle class="graph-source" cx="130" cy="36" r="22"/><circle cx="44" cy="130" r="22"/>
                  <circle cx="216" cy="130" r="22"/><circle cx="130" cy="218" r="22"/>
                  <text x="130" y="36">A</text><text x="44" y="130">B</text><text x="216" y="130">C</text><text x="130" y="218">D</text>
                </g>
              </svg>
            </section>
          </div>
          <footer class="game-footer">
            <p id="game-feedback" role="status" aria-live="polite"></p>
            <button id="game-submit" type="button">▶ 提交答案</button>
          </footer>
        </div>
      </dialog>
      <dialog id="bar-greeting" class="bar-greeting" aria-labelledby="bar-greeting-text">
        <p id="bar-greeting-text">我想跟你玩個小遊戲</p>
        <div class="bar-choices">
          <button id="bar-yes" type="button" aria-label="Y，開始遊戲">Y</button>
          <button id="bar-no" type="button" aria-label="N，留在酒吧">N</button>
        </div>
      </dialog>
      <dialog id="house-notice-dialog" class="house-notice-dialog"
        aria-labelledby="house-notice-title" aria-describedby="house-notice-content">
        <div class="house-notice-header">
          <h2 id="house-notice-title"></h2>
          <button id="house-notice-close" type="button" aria-label="關閉告示牌">✕</button>
        </div>
        <p id="house-notice-content" tabindex="0"></p>
      </dialog>
      <div id="hud">
        <div id="status-pill" class="pill" data-state="connecting">
          <span class="dot" aria-hidden="true"></span>
          <span id="status-text">連線中…</span>
        </div>
        <div id="count-pill" class="pill" hidden>
          <span id="count-text">0</span><span class="pill-unit">人在線</span>
        </div>
      </div>
      <div
        id="joystick"
        class="joystick"
        role="application"
        aria-label="Movement joystick"
        hidden
      >
        <div class="joystick-knob"></div>
      </div>

      <div id="zone-banner" class="zone-banner" aria-live="polite" hidden></div>

      <div id="emote-bar" class="emote-bar" hidden></div>

      <div id="chat-dock" class="chat-dock" hidden>
        <button id="chat-open" class="chat-open" type="button" aria-label="Say something">
          說話
        </button>
        <form id="chat-form" class="chat-form" hidden>
          <input
            id="chat-input"
            class="chat-input"
            type="text"
            maxlength="120"
            autocomplete="off"
            autocapitalize="sentences"
            enterkeyhint="send"
            placeholder="說點什麼…"
          />
          <button class="chat-send" type="submit">送出</button>
        </form>
      </div>

      <button id="minimap-toggle" class="minimap-toggle" type="button" hidden
              aria-label="Toggle minimap">地圖</button>
      <canvas id="minimap" class="minimap" width="160" height="120" hidden
              aria-label="Minimap"></canvas>

      <div id="notice" role="status" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
